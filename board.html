<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cash Flow Lab — Board</title><link rel="stylesheet" href="css/app.css"><script src="config.js"></script></head>
<body><main class="wrap"><div class="card" id="b"><h2>Class board is off</h2><p>Cash Flow Lab ships with the public board disabled (config.js → leaderboard.enabled). This unit is hard; learning status is shown privately to each student and on the teacher page instead.</p></div></main>
<script type="module">const C=window.CFL_CONFIG||{}; if(C.leaderboard&&C.leaderboard.enabled&&C.firebase){ const el=document.getElementById('b'); el.innerHTML='<h2>Concepts cleared</h2><p class="muted">Loading…</p>'; const [a,au,fs]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js')]); const app=a.initializeApp(C.firebase); await au.signInAnonymously(au.getAuth(app)); const db=fs.getFirestore(app); fs.onSnapshot(fs.collection(db,'cfl_public_stats'),s=>{ const rows=s.docs.map(d=>d.data()).filter(r=>r.secure>=1).sort((x,y)=>y.secure-x.secure).slice(0,10); el.innerHTML='<h2>Concepts secure or mastered</h2>'+(rows.map(r=>`<div class="frow"><span>${r.name} · ${r.block}</span><b>${r.secure}</b></div>`).join('')||'<p class="muted">Nobody has cleared a concept yet.</p>'); }); }</script></body></html>
