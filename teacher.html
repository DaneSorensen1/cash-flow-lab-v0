<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cash Flow Lab — Teacher</title>
<link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/teacher.css"><script src="config.js"></script></head>
<body><header class="top"><div class="brand">Cash Flow Lab — Teacher</div><nav><button data-v="overview" class="on">Overview</button><button data-v="concepts">Concept map</button><button data-v="skills">Skill map</button><button data-v="misc">Misconceptions</button><button data-v="caps">Capstones</button></nav><button id="csv">Download CSV</button></header>
<main class="wrap" id="view"><p class="muted">Connecting…</p></main>
<script type="module">
import { CONCEPTS, SKILL_LABELS, MISCONCEPTIONS } from './js/curriculum/concepts.js';
const CFG = window.CFL_CONFIG || {}; const $ = s => document.querySelector(s); const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATES = ['not_started','learning','practicing','secure','mastered']; const SL = { not_started:'—', learning:'L', practicing:'P', secure:'S', mastered:'M' };
const HEAT = ['accounts_receivable','accounts_payable','accrued_liabilities','unearned_revenue','prepaid_expenses','inventory','depreciation','gain_loss','investing','financing','full_statement'];
let rows = []; let v = 'overview'; let skillConcept = 'accounts_receivable'; let sortKey = 'name';
const blocks = CFG.blocks || [];
function render(){ const V = $('#view'); if (!rows.length && !window.__live){ V.innerHTML = `<div class="card"><h2>Class record not turned on</h2><p>config.js has <code>firebase: null</code>, so progress stays on each student's device. See DEPLOY.md (Path B) to turn on the live class record.</p></div>`; return; }
  const byBlock = b => rows.filter(r => r.block === b.id);
  if (v === 'overview'){ V.innerHTML = `<div class="toolbar"><span>${rows.length} students · live</span><label>Sort <select id="sort">${['name','progress','weakest','module','last'].map(k=>`<option ${sortKey===k?'selected':''}>${k}</option>`).join('')}</select></label></div>` + blocks.map(b => { const rs = sorted(byBlock(b)); return `<h2>${esc(b.name)} <span class="muted">(${rs.length})</span></h2><div class="tw"><table><thead><tr><th>Student</th><th>Current module</th><th>Introduced</th><th>Secure+</th><th>Recent independent</th><th>Hints (last 20)</th><th>Capstones</th><th>Last active</th><th>Needs help?</th></tr></thead><tbody>${rs.map(r=>`<tr class="click" data-uid="${esc(r.uid)}"><td><b>${esc(r.name)}</b></td><td>${esc(r.currentModule)}</td><td class="c">${(r.introduced||[]).length}</td><td class="c">${Object.values(r.conceptStates||{}).filter(s=>s==='secure'||s==='mastered').length}</td><td class="c">${pct(r.recentAccuracy)}</td><td class="c">${r.hintsRecent||0}</td><td>${capsText(r)}</td><td>${r.lastActive?new Date(r.lastActive).toLocaleString():''}</td><td class="c">${needsHelp(r)?'<span class="flag">●</span>':''}</td></tr>`).join('')}</tbody></table></div>`; }).join('');
    $('#sort').onchange = e => { sortKey = e.target.value; render(); }; V.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => detail(tr.dataset.uid)); }
  if (v === 'concepts'){ V.innerHTML = blocks.map(b => `<h2>${esc(b.name)}</h2><div class="tw"><table><thead><tr><th>Student</th>${HEAT.map(c=>`<th>${esc(CONCEPTS[c].label.replace('Accounts ','').replace(' Liabilities','').replace('Complete ',''))}</th>`).join('')}</tr></thead><tbody>${sorted(byBlock(b)).map(r=>`<tr class="click" data-uid="${esc(r.uid)}"><td><b>${esc(r.name)}</b></td>${HEAT.map(c=>{ const s=(r.conceptStates||{})[c]||'not_started'; return `<td class="c st-${s}" title="${s}">${SL[s]}</td>`; }).join('')}</tr></tbody></table></div>`).join('') + `<p class="muted small">— not started · L learning · P practicing · S secure · M mastered</p>`; V.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => detail(tr.dataset.uid)); }
  if (v === 'skills'){ const skills = CONCEPTS[skillConcept].skills; V.innerHTML = `<div class="toolbar"><label>Concept <select id="sc">${HEAT.map(c=>`<option value="${c}" ${c===skillConcept?'selected':''}>${esc(CONCEPTS[c].label)}</option>`).join('')}</select></label></div>` + blocks.map(b => `<h2>${esc(b.name)}</h2><div class="tw"><table><thead><tr><th>Student</th>${skills.map(s=>`<th>${SKILL_LABELS[s]}</th>`).join('')}</tr></thead><tbody>${sorted(byBlock(b)).map(r=>`<tr><td><b>${esc(r.name)}</b></td>${skills.map(s=>{ const x=((r.skillStates||{})[skillConcept]||{})[s]; return `<td class="c ${x==null?'':x>=0.75?'g':x>=0.5?'y':'r'}">${x==null?'—':Math.round(x*100)+'%'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`).join(''); $('#sc').onchange = e => { skillConcept = e.target.value; render(); }; }
  if (v === 'misc'){ const counts = {}; for (const r of rows) for (const [k,n] of Object.entries(r.misconceptionCounts||{})) { counts[k] = counts[k] || { n:0, students:[] }; counts[k].n += n; counts[k].students.push(r.name); } const list = Object.entries(counts).sort((a,b)=>b[1].students.length-a[1].students.length); V.innerHTML = `<h2>Class-wide misconceptions</h2>${list.length?`<div class="tw"><table><thead><tr><th>Students</th><th>Events</th><th>Code</th><th>Misconception</th><th>Who</th></tr></thead><tbody>${list.map(([k,x])=>`<tr><td class="c"><b>${x.students.length}</b></td><td class="c">${x.n}</td><td>${k}</td><td>${esc(MISCONCEPTIONS[k]||k)}</td><td class="small">${esc(x.students.join(', '))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nothing logged yet.</p>'}`; }
  if (v === 'caps'){ V.innerHTML = blocks.map(b => `<h2>${esc(b.name)}</h2><div class="tw"><table><thead><tr><th>Student</th><th>Guided capstone</th><th>Integrated capstone</th></tr></thead><tbody>${sorted(byBlock(b)).map(r=>`<tr><td><b>${esc(r.name)}</b></td>${['cap1','cap2'].map(id=>{ const c=(r.capstones||{})[id]; return `<td>${c?`${c.ties?'✓ ties':'started'} · O ${fmt(c.totals&&c.totals.o)} / I ${fmt(c.totals&&c.totals.i)} / F ${fmt(c.totals&&c.totals.f)} · ${(c.wrong||[]).length} wrong tries · ${c.hints||0} hints`:'—'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`).join(''); }
}
function detail(uid){ const r = rows.find(x=>x.uid===uid); if (!r) return; const V = $('#view'); V.innerHTML = `<button class="link" id="back">← Back</button><h2>${esc(r.name)} · ${esc((blocks.find(b=>b.id===r.block)||{}).name||r.block)}</h2><div class="cards"><div class="card"><h3>Concepts</h3><table><tbody>${HEAT.map(c=>`<tr><td>${esc(CONCEPTS[c].label)}</td><td class="st-${(r.conceptStates||{})[c]||'not_started'}">${((r.conceptStates||{})[c]||'not started').replace('_',' ')}</td></tr>`).join('')}</tbody></table></div><div class="card"><h3>Misconceptions</h3>${Object.entries(r.misconceptionCounts||{}).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div>${n}× ${k} ${esc(MISCONCEPTIONS[k]||'')}</div>`).join('')||'<span class="muted">none</span>'}</div><div class="card"><h3>Written explanations</h3>${(r.explanations||[]).map(e=>`<div class="exp"><div class="muted small">${esc(CONCEPTS[e.concept]?CONCEPTS[e.concept].label:e.concept)} · ${new Date(e.ts).toLocaleString()}</div>${esc(e.text)}</div>`).join('')||'<span class="muted">none yet</span>'}</div><div class="card"><h3>Capstones</h3>${Object.entries(r.capstones||{}).map(([id,c])=>`<div><b>${id}</b>: ${c.ties?'ties':'in progress'} · wrong tries: ${(c.wrong||[]).join(', ')||'none'} · hints ${c.hints||0}</div>`).join('')||'<span class="muted">not started</span>'}</div></div>`; $('#back').onclick = render; }
function sorted(rs){ const k = sortKey; return rs.slice().sort((a,b)=>{ if (k==='name') return a.name.localeCompare(b.name); if (k==='progress') return (b.introduced||[]).length-(a.introduced||[]).length; if (k==='weakest') return (a.recentAccuracy??1)-(b.recentAccuracy??1); if (k==='module') return String(a.currentModule).localeCompare(String(b.currentModule)); return (b.lastActive||0)-(a.lastActive||0); }); }
function pct(x){ return x==null?'—':Math.round(x*100)+'%'; } function fmt(n){ return n==null?'—':n.toLocaleString(); } function capsText(r){ return ['cap1','cap2'].map(id=>{ const c=(r.capstones||{})[id]; return c?(c.ties?'✓':'…'):'—'; }).join(' '); }
function needsHelp(r){ const weak = Object.values(r.conceptStates||{}).filter(s=>s==='learning'||s==='practicing').length; return (r.recentAccuracy!=null && r.recentAccuracy < 0.6) || (r.hintsRecent||0) > 8 || (weak >= 4 && (r.introduced||[]).length >= 8); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { v = b.dataset.v; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
$('#csv').onclick = () => { const head = ['name','block','current_module','introduced','secure_or_mastered','recent_independent_accuracy','hints_recent', ...HEAT.map(c=>'state_'+c), 'misconceptions','cap1','cap2','last_active']; const lines = [head.join(',')]; for (const r of rows){ const vals = [r.name, (blocks.find(b=>b.id===r.block)||{}).name||r.block, r.currentModule, (r.introduced||[]).length, Object.values(r.conceptStates||{}).filter(s=>s==='secure'||s==='mastered').length, r.recentAccuracy==null?'':Math.round(r.recentAccuracy*100), r.hintsRecent||0, ...HEAT.map(c=>(r.conceptStates||{})[c]||''), Object.entries(r.misconceptionCounts||{}).map(([k,n])=>k+':'+n).join(' '), ...['cap1','cap2'].map(id=>{ const c=(r.capstones||{})[id]; return c?(c.ties?'ties':'started'):''; }), r.lastActive?new Date(r.lastActive).toISOString():'']; lines.push(vals.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')); } const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'})); a.download = 'cash-flow-lab.csv'; a.click(); };
(async () => { if (!CFG.firebase){ render(); return; } try {
  const [appM, authM, fsM] = await Promise.all([ import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'), import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js'), import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js') ]);
  const app = appM.initializeApp(CFG.firebase); const auth = authM.getAuth(app); const cred = await authM.signInAnonymously(auth); const db = fsM.getFirestore(app); window.__live = true;
  $('#view').innerHTML = `<p class="muted">Your anonymous id on this device: <code>${cred.user.uid}</code>. If the roster stays empty, add a document with this id to the <code>cfl_teachers</code> collection (see DEPLOY.md).</p>`;
  fsM.onSnapshot(fsM.collection(db,'cfl_stats'), snap => { rows = snap.docs.map(d => Object.assign({ uid:d.id }, d.data())); render(); }, err => { $('#view').innerHTML = `<div class="card"><h2>Not authorized yet</h2><p>Add a document named <code>${cred.user.uid}</code> to the <code>cfl_teachers</code> collection in Firestore, then refresh. Error: ${esc(err.message)}</p></div>`; });
} catch(e){ $('#view').innerHTML = `<div class="card"><h2>Could not connect</h2><p>${esc(e.message)}</p></div>`; } })();
</script></body></html>
